job: extension
config:
  name: "qwen_lora_a100"
  process:
    - type: 'sd_trainer'
      training_folder: "output"
      device: cuda:0
      # Подставляется вместо [trigger] в sample.prompts и в подписях; совпадай с токеном в .txt у картинок
      trigger_word: "ohwx_borat_jeffrey_v1"
      network:
        type: "lora"
        linear: 32             # Higher rank for more detail (A100 can handle it)
        linear_alpha: 32
      save:
        dtype: bfloat16        # A100 loves BF16
        save_every: 500
        max_step_saves_to_keep: 5
      datasets:
        - folder_path: "/home/CreeperHuggerRush/team2-subteam1/data/tune_images" # Folder with .jpg and .txt files
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024] # Multi-resolution training
      train:
        batch_size: 4          # Increased for A100 stability
        steps: 3000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit" 
        lr: 0.0001
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "Qwen/Qwen-Image-2512"
        is_flux: false
        is_qwen: true          # Vital for Qwen architecture support
        quantize: false        # Keep FALSE for A100 (Full quality)
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "ohwx_borat_jeffrey_v1 in a space suit, high detail"
          - "ohwx_borat_jeffrey_v1 holding a sign that says 'A100 POWER'"
